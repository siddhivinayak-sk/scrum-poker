name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run server tests
        run: npx jest --forceExit --no-coverage --testPathIgnorePatterns="src/routes/__tests__/auth.test.ts" --testPathIgnorePatterns="src/routes/__tests__/sessions.test.ts" --testPathIgnorePatterns="src/__tests__/server.test.ts"
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Run client tests
        run: npx ng test --no-watch
        working-directory: client
        continue-on-error: true

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: siddhivinayaksk/scrum-pocker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
