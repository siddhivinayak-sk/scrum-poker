{{- include "scrum-poker.validate" . -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{/*
  Quoted: metadata.name is a string in the Kubernetes API, and a
  serviceAccount.name or fullnameOverride of y, n, no, on, or 010 renders as a
  bare scalar the YAML parser resolves to a boolean or a number, which the API
  server rejects with "cannot unmarshal bool into Go struct field
  ObjectMeta.metadata.name of type string".
  */}}
  name: {{ include "scrum-poker.serviceAccountName" . | quote }}
  labels:
    {{- include "scrum-poker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
