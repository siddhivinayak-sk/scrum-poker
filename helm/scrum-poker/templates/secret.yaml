{{- include "scrum-poker.validate" . -}}
{{- if not .Values.auth.existingSecret }}
{{/*
The entire document body sits inside the conditional, so a non-empty
auth.existingSecret renders zero resources rather than an empty document
separator. The Deployment then points its JWT_SECRET secretKeyRef at the
operator-named Secret instead.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scrum-poker.secretName" . }}
  labels: {{- include "scrum-poker.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ include "scrum-poker.jwtSecret" . | b64enc | quote }}
{{- end }}
